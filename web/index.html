 /* The camera stands by while her room loads (src/loading/standby.js writes the figures); same marks, type and
    positions as the camera display that takes over (src/hud/hud.css). */
 #note,#standby{font:400 13px/1.4 'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;color:rgba(255,246,232,.75);
  text-shadow:0 0 7px rgba(30,15,5,.55),0 1px 2px rgba(30,15,5,.6);-webkit-font-smoothing:antialiased}
 #note{position:fixed;left:0;right:0;bottom:max(44px,calc(env(safe-area-inset-bottom) + 16px));z-index:2;padding:0 16px;text-align:center}
 #note .sb-detail{font-variant-numeric:tabular-nums}
 #note .sb-detail:not(:empty)::before{content:" \00b7\a0"}
 #stage.ready+#note{display:none}
 #standby{--edge:28px;--inset:48px;--top:44px;position:fixed;inset:0;z-index:2;pointer-events:none;user-select:none;-webkit-user-select:none;
  font-size:15px;line-height:1;transition:opacity .5s ease,visibility 0s .5s}
 /* it stays on behind the start button and goes as the focus pull begins; with the intro skipped it goes when she is ready */
 #stage.ready~#standby{opacity:0;visibility:hidden}
 body.is-intro #stage.ready~#standby{opacity:1;visibility:visible}
 #standby .sb-c{position:absolute;width:26px;height:26px;border:0 solid rgba(255,246,232,.5)}
 #standby .tl{top:max(var(--edge),env(safe-area-inset-top));left:max(var(--edge),env(safe-area-inset-left));border-top-width:1.5px;border-left-width:1.5px}
 #standby .tr{top:max(var(--edge),env(safe-area-inset-top));right:max(var(--edge),env(safe-area-inset-right));border-top-width:1.5px;border-right-width:1.5px}
 #standby .bl{bottom:max(var(--edge),env(safe-area-inset-bottom));left:max(var(--edge),env(safe-area-inset-left));border-bottom-width:1.5px;border-left-width:1.5px}
 #standby .br{bottom:max(var(--edge),env(safe-area-inset-bottom));right:max(var(--edge),env(safe-area-inset-right));border-bottom-width:1.5px;border-right-width:1.5px}
 #standby .sb-state,#standby .sb-pct{position:absolute;top:max(var(--top),calc(env(safe-area-inset-top) + 16px))}
 #standby .sb-state{left:max(var(--inset),calc(env(safe-area-inset-left) + 20px));display:flex;align-items:center;gap:8px}
 #standby .sb-state i{width:7px;height:7px;border-radius:50%;background:rgba(255,246,232,.85);box-shadow:0 0 6px rgba(30,15,5,.5);animation:sb-blink 1.1s steps(1) infinite}
 #standby[data-state=ready] .sb-state i{animation:none}
 #standby[data-state=failed] .sb-state i{animation:none;opacity:.25}
 #standby .sb-pct{right:max(var(--inset),calc(env(safe-area-inset-right) + 20px));font-variant-numeric:tabular-nums}
 @keyframes sb-blink{0%,50%{opacity:1}51%,100%{opacity:.15}}
 @media (max-width:600px){
  #standby{--edge:14px;--inset:26px;--top:26px}
  #standby .sb-c{width:20px;height:20px}
  #note{bottom:max(26px,calc(env(safe-area-inset-bottom) + 16px))}
 }
 @media (prefers-reduced-motion:reduce){
  #standby{transition:none}
  #standby .sb-state i{animation:none}
 }

<div id="note" role="status">loading her room<span class="sb-detail" aria-hidden="true"></span></div>
<div id="standby" aria-hidden="true">
 <i class="sb-c tl"></i><i class="sb-c tr"></i><i class="sb-c bl"></i><i class="sb-c br"></i>
 <span class="sb-state"><i></i><span class="sb-word">stby</span></span>
 <span class="sb-pct">0%</span>
</div>
<script type="module" src="/src/viewer/main.js"></script>
